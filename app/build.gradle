plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

// ---- Read M-Pesa settings from local.properties (never committed) ----
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def lp = { String key, String fallback -> localProps.getProperty(key, fallback).trim() }

android {
    namespace 'ke.ac.usiu.registration'
    compileSdk 34

    defaultConfig {
        applicationId "ke.ac.usiu.registration"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "MPESA_ENV", "\"${lp('MPESA_ENV', 'sandbox')}\""
        buildConfigField "String", "MPESA_CONSUMER_KEY", "\"${lp('MPESA_CONSUMER_KEY', '')}\""
        buildConfigField "String", "MPESA_CONSUMER_SECRET", "\"${lp('MPESA_CONSUMER_SECRET', '')}\""
        buildConfigField "String", "MPESA_SHORTCODE", "\"${lp('MPESA_SHORTCODE', '')}\""
        buildConfigField "String", "MPESA_PASSKEY", "\"${lp('MPESA_PASSKEY', '')}\""
        buildConfigField "String", "MPESA_TRANSACTION_TYPE", "\"${lp('MPESA_TRANSACTION_TYPE', 'CustomerPayBillOnline')}\""
        buildConfigField "String", "MPESA_PARTY_B", "\"${lp('MPESA_PARTY_B', lp('MPESA_SHORTCODE', ''))}\""
        buildConfigField "String", "MPESA_CALLBACK_URL", "\"${lp('MPESA_CALLBACK_URL', 'https://example.com/mpesa/callback')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'

    // Cloud Firestore (offline persistence + automatic sync)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-database:23.0.0'
    implementation 'com.google.firebase:firebase-firestore'

    // HTTP client for the M-Pesa (Daraja) STK Push API
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
